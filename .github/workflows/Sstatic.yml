<!DOCTYPE html>
<html>
<head>
    <style>
.form-outro {
    max-width: 900px;
    margin: 25px auto 0;
    padding: 20px 30px;
    text-align: center;
    color: #5f6b7a;
    font-size: 14px;
    line-height: 1.6;
}

.form-outro p {
    margin: 5px 0;
}
    
/* ==================== GENERATED CV ==================== */

#cv-output {
    max-width: 900px;
    margin: 30px auto;
    padding: 50px;
    background: #ffffff;
    border: 1px solid #ddd;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
    color: #222;
}

.cv-title {
    text-align: center;
    margin-bottom: 30px;
}

.cv-title h1 {
    margin: 0;
    font-size: 28px;
    color: #1f3a5f;
}

.cv-section {
    margin-top: 25px;
}

.cv-section-title {
    margin: 0 0 12px;
    padding-bottom: 6px;
    border-bottom: 2px solid #1f3a5f;
    color: #1f3a5f;
    font-size: 18px;
}

.cv-personal {
    display: grid;
    grid-template-columns: 1fr 150px;
    gap: 25px;
    align-items: start;
}

.cv-personal .cv-photo {
    grid-column: 2;
    grid-row: 1;
    justify-self: end;
}

.cv-photo {
    width: 120px;
    height: 150px;
    object-fit: cover;
    border: 1px solid #aaa;
    justify-self: end;
}

.cv-info {
    display: grid;
    grid-template-columns: 170px 1fr;
    row-gap: 7px;
}

.cv-label {
    font-weight: bold;
}

.cv-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 8px;
}

.cv-table th,
.cv-table td {
    border: 1px solid #bbb;
    padding: 8px;
    text-align: left;
}

.cv-signature {
    margin-top: 45px;
    text-align: right;
}

.cv-signature img {
    display: block;
    width: 140px;
    max-height: 60px;
    object-fit: contain;
    margin-left: auto;
    margin-bottom: 5px;
}

.cv-signature-line {
    width: 140px;
    margin-left: auto;
    border-top: 1px solid #222;
    padding-top: 5px;
}

.cv-buttons {
    max-width: 900px;
    margin: 20px auto;
    display: flex;
    justify-content: center;
    gap: 12px;
}

.cv-buttons button {
    padding: 10px 20px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 15px;
}

.cv-personal {
    grid-template-columns: 1fr;
}

    .cv-personal {
        grid-template-columns: 1fr;
    }

    .cv-photo {
        justify-self: start;
    }

    .cv-info {
        grid-template-columns: 1fr;
    }
}
    
/* ==================== ADDRESS SECTION ==================== */

.address-section {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0 20px;
    margin-top: 8px;
}

.address-field {
    display: block;
    margin-bottom: 18px;
}

.address-field > label {
    display: block;
    margin-bottom: 5px;
    font-weight: normal;
    color: inherit;
}

.address-field.full-width {
    grid-column: 1 / -1;
}


/* ==================== LOCAL GOVERNMENT ==================== */

.local-government-options {
    display: flex;
    gap: 18px;
    margin: 8px 0 12px;
    flex-wrap: wrap;
}

.local-government-options label {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-weight: normal;
}

.local-government-options input[type="radio"] {
    width: auto;
    margin: 0;
}

.local-government-input {
    display: none;
    margin-bottom: 18px;
}

.local-government-input label {
    display: block;
    margin-bottom: 5px;
    font-weight: normal;
}

.local-government-input input {
    width: 100%;
}

.address-field small {
    font-weight: normal;
    color: #777;
}

@media (max-width: 650px) {
    .address-section {
        grid-template-columns: 1fr;
    }

    .address-field.full-width {
        grid-column: 1;
    }
}
.intro {
    text-align: center;
    margin-bottom: 30px;
}

.intro h1 {
    margin: 0 0 10px;
    color: #1f3a5f;
    font-size: 32px;
}

.intro p {
    margin: 0;
    color: #5f6b7a;
    font-size: 15px;
    line-height: 1.6;
}
input[type="radio"] {
    width: auto;
    margin-right: 6px;
}
.blood-types,
.marital-status {
    display: grid;
    gap: 10px;
}

.blood-types {
    grid-template-columns: repeat(4, 1fr);
}

.marital-status {
    grid-template-columns: repeat(2, 1fr);
}

.blood-types label,
.marital-status label {
    display: flex;
    align-items: center;
    gap: 6px;
}
.height-inputs input {
    width: 100px;
    box-sizing: border-box;
}
body {
    margin: 0;
    padding: 40px 20px;
    background-color: #f5f7fa;
    font-family: Arial, Helvetica, sans-serif;
    color: #1f2937;
}

form {
    max-width: 900px;
    margin: auto;
    padding: 40px;
    background-color: #ffffff;
    border: 1px solid #e1e5ea;
    border-radius: 8px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
}
input[type="text"],
input[type="number"],
input[type="date"],
input[type="tel"],
input[type="email"],
input[type="file"],
select,
textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #d7dee8;
    border-radius: 6px;
    box-sizing: border-box;
    background-color: #ffffff;
    font-size: 15px;
}

input[type="radio"] {
    width: auto;
    margin: 0 6px 0 0;
    vertical-align: middle;
}
.section-heading {
    margin-top: 35px;
    padding-bottom: 10px;
    border-bottom: 2px solid #1f3a5f;
    color: #1f3a5f;
    font-size: 20px;
}
.gender-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 8px;
}

.gender-options label {
    display: flex;
    align-items: center;
    gap: 6px;
}

.gender-options input[type="radio"] {
    width: auto;
    margin: 0;
}
    </style>
</head>
    <body>
<div class="intro">
    <h1>Curriculum Vitae</h1>
<p>
    Please provide the following information to prepare your curriculum vitae.
    Make sure the information you provide is accurate and up to date.
    If you do not wish to fill in an optional field or do not currently have the information, you may enter "N/A" or "0" for numerical fields where applicable.
</p>
</div>
<form>
<p class="section-heading">Personal Information</p>
    
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name">
    
    <br><br>
    
    <label for="nickname">Nickname:</label>
    <input type="text" id="nickname" name="nickname">
    
    <br><br>
    
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" name="dob">
    
    <br><br>
    
    <label for="age">Age:</label>
<input type="number" id="age" name="age" readonly>
    
    <br><br>
<label>Gender:</label><br>

<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>
<br>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>
<br>

<input type="radio" id="third" name="gender" value="Third Gender">
<label for="third">Third Gender</label>

<br><br>

<label for="nationality">Nationality:</label>
<input type="text" id="nationality" name="nationality">

<br><br>

<label for="religion">Religion:</label>
<input type="text" id="religion" name="religion">

<br><br>

<label>Blood Type:</label>

<div class="blood-types">
    <label><input type="radio" name="blood" value="A+"> A+</label>
    <label><input type="radio" name="blood" value="A-"> A-</label>
    
    <label><input type="radio" name="blood" value="B+"> B+</label>
    <label><input type="radio" name="blood" value="B-"> B-</label>
    
    <label><input type="radio" name="blood" value="AB+"> AB+</label>
    <label><input type="radio" name="blood" value="AB-"> AB-</label>
    
    <label><input type="radio" name="blood" value="O+"> O+</label>
    <label><input type="radio" name="blood" value="O-"> O-</label>
</div>

<br><br>

<label>Marital Status:</label>

<div class="marital-status">
    <label><input type="radio" name="marital" value="Unmarried"> Unmarried</label>
    <label><input type="radio" name="marital" value="Married"> Married</label>

    <label><input type="radio" name="marital" value="Divorced"> Divorced</label>
    <label><input type="radio" name="marital" value="Widowed"> Widowed</label>
</div>

<br><br>

<label for="id-number">NID / Passport / Birth Certificate No.:</label>
<input type="number" id="id-number" name="id-number">

<br><br>

<label>Height:</label>

<div class="height-inputs">
    <input type="number" id="height-feet" name="height-feet" min="0" placeholder="Feet">
    <input type="number" id="height-inch" name="height-inch" min="0" max="11" placeholder="Inch">
</div>
<br><br>
<label for="weight">Weight:</label>
<input type="number" id="weight" name="weight" min="0" step="0.1" placeholder="kg">
<br><br>

<label for="photo">Image (Passport Size):</label>
<input type="file" id="photo" name="photo" accept="image/*">
<br><br>


<p class="section-heading">Contact</p>
<label for="phone1">Phone Number 1:</label>
<input type="tel" id="phone1" name="phone1">
<br><br>
<label for="phone2">Phone Number 2:</label>
<input type="tel" id="phone2" name="phone2" placeholder="Optional">
<br><br>
<label for="email">Email:</label>
<input type="email" id="email" name="email">
<br><br>


