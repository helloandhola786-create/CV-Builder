</form>
<div class="form-outro">
    <p>
        Thank you for providing your information.
        Please review all the information carefully before generating your CV.
    </p>
    <p>
        Your information will be used to prepare your curriculum vitae based on
        the details you have provided.
    </p>
</div>

<div id="cv-output" style="display: none;"></div>

<script>
    const dobInput = document.getElementById("dob");
    const ageInput = document.getElementById("age");

    dobInput.addEventListener("change", function () {
        const dob = new Date(this.value);
        const today = new Date();

        let age = today.getFullYear() - dob.getFullYear();

        const monthDifference = today.getMonth() - dob.getMonth();

        if (
            monthDifference < 0 ||
            (monthDifference === 0 && today.getDate() < dob.getDate())
        ) {
            age--;
        }

        ageInput.value = age;
    });
</script>
<script>

function showGovernmentField(addressType, selectedType) {

    // IDs for the three local-government fields
    const fields = [
        "union",
        "pourashava",
        "city"
    ];


    // Hide all three fields for this address
    fields.forEach(function(field) {

        const element = document.getElementById(
            addressType + "-" + field + "-field"
        );

        if (element) {
            element.style.display = "none";
        }

    });


    // Show the selected field
    const selectedField = document.getElementById(
        addressType + "-" + selectedType + "-field"
    );

    if (selectedField) {
        selectedField.style.display = "block";
    }

}

</script>
<script>
document.querySelector("form").addEventListener("submit", function(event) {
    event.preventDefault();

    const getValue = (id) => {
        const element = document.getElementById(id);
        return element ? element.value.trim() : "";
    };

    const getRadio = (name) => {
        const selected = document.querySelector(`input[name="${name}"]:checked`);
        return selected ? selected.value : "";
    };

    const photoInput = document.getElementById("photo");
    const signatureInput = document.getElementById("signature");

    const photoFile = photoInput && photoInput.files.length
        ? photoInput.files[0]
        : null;

    const signatureFile = signatureInput && signatureInput.files.length
        ? signatureInput.files[0]
        : null;

    const cvOutput = document.getElementById("cv-output");

    function createRow(label, value) {
        if (!value) return "";
        return `
            <div class="cv-label">${label}</div>
            <div>${value}</div>
        `;
    }

    function readImage(file) {
        return new Promise((resolve) => {
            if (!file) {
                resolve("");
                return;
            }

            const reader = new FileReader();

            reader.onload = function(e) {
                resolve(e.target.result);
            };

            reader.readAsDataURL(file);
        });
    }

    Promise.all([
        readImage(photoFile),
        readImage(signatureFile)
    ]).then(([photoData, signatureData]) => {

        const fullName = getValue("name") || "N/A";

        let personalInfo = "";

        personalInfo += createRow("Full Name:", fullName);
        personalInfo += createRow("Nickname:", getValue("nickname"));
        personalInfo += createRow("Date of Birth:", getValue("dob"));
        personalInfo += createRow("Age:", getValue("age"));
        personalInfo += createRow("Gender:", getRadio("gender"));
        personalInfo += createRow("Nationality:", getValue("nationality"));
        personalInfo += createRow("Religion:", getValue("religion"));
        personalInfo += createRow("Blood Type:", getRadio("blood"));
        personalInfo += createRow("Marital Status:", getRadio("marital"));
        personalInfo += createRow(
            "NID / Passport / Birth Certificate No.:",
            getValue("id-number")
        );
        personalInfo += createRow(
            "Height:",
            getValue("height-feet") || getValue("height-inch")
                ? `${getValue("height-feet") || 0} ft ${getValue("height-inch") || 0} in`
                : ""
        );
        personalInfo += createRow(
            "Weight:",
            getValue("weight") ? `${getValue("weight")} kg` : ""
        );

        cvOutput.innerHTML = `
            <div class="cv-title">
                <h1>CURRICULUM VITAE</h1>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Personal Information</h2>

                <div class="cv-personal">
                    <div class="cv-info">
                        ${personalInfo}
                    </div>

                    ${
                        photoData
                        ? `<img src="${photoData}" class="cv-photo" alt="Passport Size Photo">`
                        : ""
                    }
                </div>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Contact Information</h2>

                <div class="cv-info">
                    ${createRow("Phone Number 1:", getValue("phone1"))}
                    ${createRow("Phone Number 2:", getValue("phone2"))}
                    ${createRow("Email:", getValue("email"))}
                    ${createRow("Emergency Contact:", getValue("emergency"))}
                </div>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Family Information</h2>

                <div class="cv-info">
                    ${createRow("Father's Name:", getValue("father-name"))}
                    ${createRow("Mother's Name:", getValue("mother-name"))}
                    ${createRow("Number of Siblings:", getValue("siblings"))}
                    ${createRow("Spouse's Name:", getValue("spouse-name"))}
                    ${createRow("Spouse's Contact:", getValue("spouse-contact"))}
                    ${createRow("Number of Children:", getValue("children"))}
                </div>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Education</h2>

                <table class="cv-table">
                    <tr>
                        <th>Level</th>
                        <th>Details</th>
                    </tr>

                    <tr>
                        <td>SSC</td>
                        <td>
                            ${getValue("ssc-gpa") ? "GPA: " + getValue("ssc-gpa") + "<br>" : ""}
                            ${getValue("ssc-group") ? "Group: " + getValue("ssc-group") + "<br>" : ""}
                            ${getValue("ssc-board") ? "Board: " + getValue("ssc-board") + "<br>" : ""}
                            ${getValue("ssc-institution") ? "Institution: " + getValue("ssc-institution") : ""}
                        </td>
                    </tr>

                    <tr>
                        <td>HSC</td>
                        <td>
                            ${getValue("hsc-gpa") ? "GPA: " + getValue("hsc-gpa") + "<br>" : ""}
                            ${getValue("hsc-group") ? "Group: " + getValue("hsc-group") + "<br>" : ""}
                            ${getValue("hsc-board") ? "Board: " + getValue("hsc-board") + "<br>" : ""}
                            ${getValue("hsc-institution") ? "Institution: " + getValue("hsc-institution") : ""}
                        </td>
                    </tr>

                    <tr>
                        <td>Honours</td>
                        <td>
                            ${getValue("honours-cgpa") ? "CGPA: " + getValue("honours-cgpa") + "<br>" : ""}
                            ${getValue("honours-department") ? "Department: " + getValue("honours-department") + "<br>" : ""}
                            ${getValue("honours-institution") ? "Institution: " + getValue("honours-institution") : ""}
                        </td>
                    </tr>

                    <tr>
                        <td>Master's</td>
                        <td>
                            ${getValue("masters-cgpa") ? "CGPA: " + getValue("masters-cgpa") + "<br>" : ""}
                            ${getValue("masters-department") ? "Department: " + getValue("masters-department") + "<br>" : ""}
                            ${getValue("masters-institution") ? "Institution: " + getValue("masters-institution") : ""}
                        </td>
                    </tr>
                </table>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Occupation</h2>

                <div class="cv-info">
                    ${createRow("Position:", getValue("position"))}
                    ${createRow("Institution:", getValue("work-institution"))}
                    ${createRow("Address:", getValue("work-address"))}
                </div>
            </div>

            <div class="cv-section">
                <h2 class="cv-section-title">Others</h2>

                <div class="cv-info">
                    ${createRow("Interest:", getValue("interest"))}
                    ${createRow("Language Skills:", getValue("language-skills"))}
                    ${createRow("Computer Skills:", getValue("computer-skills"))}
                    ${createRow("Goals:", getValue("goals"))}
                </div>
            </div>

            <div class="cv-signature">
                ${
                    signatureData
                    ? `<img src="${signatureData}" alt="Signature">`
                    : ""
                }

                <div class="cv-signature-line">
                    Signature
                </div>

                <div>
                    Date: ${getValue("date") || "N/A"}
                </div>
            </div>

            <div class="cv-buttons">
                <button type="button" onclick="editCV()">Edit CV</button>
                <button type="button" onclick="window.print()">Print / Save as PDF</button>
            </div>
        `;

        document.querySelector("form").style.display = "none";
        cvOutput.style.display = "block";

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    });
});

function editCV() {
    document.querySelector("form").style.display = "block";
    document.getElementById("cv-output").style.display = "none";

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}
</script>
    </body>
</html>


